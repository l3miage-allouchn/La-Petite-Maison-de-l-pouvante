# Local infrastructure only (PostgreSQL, Kafka, Valkey, Keycloak, Kafbat UI).
# Usage: make infra   (or: docker compose -f docker-compose.infra.yml up -d --wait)
# All ports are bound to 127.0.0.1 only: nothing is exposed on the LAN.
name: petite-maison

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/local/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    networks: [pme-net]
    logging: *default-logging

  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-7YN7I_HERPW99NZWmvRbUg}  # not a secret: KRaft cluster identifier
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"]
    healthcheck:
      # Lightweight TCP check (a JVM-based CLI every 10 s costs a full CPU core).
      # Functional readiness is proven by kafka-init, which creates the topics with a real client.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092' 2>/dev/null"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      start_interval: 2s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g, cpus: "1.0" }
    networks: [pme-net]
    logging: *default-logging

  # Creates the topics, then stays idle so that `up --wait` succeeds and
  # services can depend on "topics ready" (healthy = marker file present).
  kafka-init:
    image: apache/kafka:4.4.0
    restart: on-failure
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "-c", "/bin/bash /scripts/create-topics.sh && touch /tmp/topics-ready && exec sleep infinity"]
    environment:
      KAFKA_BOOTSTRAP: kafka:19092
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ./infra/local/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/topics-ready"]
      interval: 5s
      timeout: 2s
      start_period: 30s
      retries: 30
    deploy:
      resources:
        limits: { memory: 256m }
    networks: [pme-net]
    logging: *default-logging

  valkey:
    image: valkey/valkey:9.1.3-alpine
    restart: unless-stopped
    user: valkey  # non-root (the entrypoint only drops privileges for a bare valkey-server command)
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
      REDISCLI_AUTH: ${VALKEY_PASSWORD:?set in .env}
    command: ["sh", "-c", "exec valkey-server --requirepass \"$$VALKEY_PASSWORD\" --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru"]
    volumes:
      - valkey-data:/data
    ports: ["127.0.0.1:${VALKEY_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 192m, cpus: "0.5" }
    networks: [pme-net]
    logging: *default-logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?set in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?set in .env}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      # Public issuer seen by browsers and validated by services (ADR-005).
      KC_HOSTNAME: http://localhost:8080
      # Containers reach Keycloak through http://keycloak:8080 for JWKS/token calls.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=70 -XX:InitialRAMPercentage=30
      # Values substituted into the realm import file
      KC_FRONTEND_URL: ${KC_FRONTEND_URL:-http://localhost:3000}
      KC_FRONTEND_CLIENT_SECRET: ${KC_FRONTEND_CLIENT_SECRET:?set in .env}
      KC_USER_NESRINE_PASSWORD: ${KC_USER_NESRINE_PASSWORD:?set in .env}
      KC_USER_ADMIN_PASSWORD: ${KC_USER_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ./infra/local/keycloak/realm-petite-maison.json:/opt/keycloak/data/import/realm-petite-maison.json:ro
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      # The image has no curl: plain HTTP request over bash /dev/tcp on the management port.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 180s   # first start (schema + realm import) can be slow on a busy laptop
      start_interval: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 1g, cpus: "2.0" }
    networks: [pme-net]
    logging: *default-logging

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: petite-maison-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "false"
      LOGGING_LEVEL_ROOT: info
      LOGGING_LEVEL_IO_KAFBAT: info
      JAVA_OPTS: -XX:MaxRAMPercentage=70
    ports: ["127.0.0.1:${KAFKA_UI_HOST_PORT:-8085}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- -T 8 http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 10s
      start_period: 90s
      start_interval: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 384m, cpus: "0.5" }
    networks: [pme-net]
    logging: *default-logging

volumes:
  postgres-data:
  kafka-data:
  valkey-data:

networks:
  pme-net:
    name: pme-net
