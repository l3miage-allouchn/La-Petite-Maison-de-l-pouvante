# catalog-service — every environment-specific value comes from an environment variable.
# Profiles: "local" (run from the IDE against `make infra`), "docker" (Compose network).
spring:
  application:
    name: catalog-service
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalog}
    username: ${DB_USER:catalog}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 5
        max.block.ms: 10000         # async virtual thread: bounded wait, never on the HTTP path
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000  # must be >= linger.ms + request.timeout.ms
  security:
    oauth2:
      resourceserver:
        jwt:
          # Public issuer (what browsers see, the "iss" claim) ...
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/petite-maison}
          # ... and the URL this service can actually reach for signing keys (ADR-005).
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8080/realms/petite-maison/protocol/openid-connect/certs}
          audiences: ${OIDC_AUDIENCE:catalog-api}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    # Spring's default listener logs the full payload (user ids) on failure; ProductViewedPublisher logs instead.
    org.springframework.kafka.support.LoggingProducerListener: "off"
  structured:
    format:
      console: ecs      # JSON logs (Elastic Common Schema), MDC correlation_id included

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  kafka:
    topics:
      product-viewed: ${KAFKA_TOPIC_PRODUCT_VIEWED:catalog.product-viewed}
