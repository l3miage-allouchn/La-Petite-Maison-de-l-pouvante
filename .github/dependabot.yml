# Dependabot — ecosystems are added as each service is created
# (maven: phase 2, uv: phase 3, npm: phase 4, docker: phases 2-4).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /services/catalog-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      spring:
        patterns: ["org.springframework*"]

  - package-ecosystem: docker
    directory: /services/catalog-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: uv
    directory: /services/reco-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /services/reco-service
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /services/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"]
      test:
        patterns: ["vitest", "@vitest/*", "@testing-library/*", "@playwright/test", "@axe-core/*", "jsdom"]

  - package-ecosystem: docker
    directory: /services/frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
