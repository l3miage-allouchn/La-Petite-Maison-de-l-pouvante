# Full local stack: infrastructure + application services.
# Usage: make dev
name: petite-maison

include:
  - docker-compose.infra.yml

services:
  catalog-service:
    build:
      context: services/catalog-service
    image: petite-maison/catalog-service:local
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${CATALOG_DB_NAME:-catalog}
      DB_USER: ${CATALOG_DB_USER:-catalog}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set in .env}
      CORS_ALLOWED_ORIGINS: ${KC_FRONTEND_URL:-http://localhost:3000}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError
    ports: ["127.0.0.1:${CATALOG_HOST_PORT:-8081}:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1.0" }
    networks: [pme-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  reco-service:
    build:
      context: services/reco-service
    image: petite-maison/reco-service:local
    restart: unless-stopped
    depends_on:
      valkey: { condition: service_healthy }
      kafka-init: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set in .env}
      OIDC_ISSUER_URI: http://localhost:8080/realms/petite-maison
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/petite-maison/protocol/openid-connect/certs
      OIDC_AUDIENCE: catalog-api
      CATALOG_API_URL: http://catalog-service:8080
      CORS_ALLOWED_ORIGINS: '["${KC_FRONTEND_URL:-http://localhost:3000}"]'
      RECO_MODEL: ${RECO_MODEL:-cooccurrence}
    ports: ["127.0.0.1:${RECO_HOST_PORT:-8082}:8080"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 256m, cpus: "0.5" }
    networks: [pme-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build:
      context: services/frontend
    image: petite-maison/frontend:local
    restart: unless-stopped
    depends_on:
      catalog-service: { condition: service_healthy }
      reco-service: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    environment:
      AUTH_SECRET: ${AUTH_SECRET:?set in .env}
      AUTH_URL: ${KC_FRONTEND_URL:-http://localhost:3000}
      AUTH_KEYCLOAK_ID: frontend
      AUTH_KEYCLOAK_SECRET: ${KC_FRONTEND_CLIENT_SECRET:?set in .env}
      # Browser-facing issuer vs. server-side URL of the same realm (ADR-005)
      KEYCLOAK_ISSUER: http://localhost:8080/realms/petite-maison
      KEYCLOAK_INTERNAL_ISSUER: http://keycloak:8080/realms/petite-maison
      CATALOG_API_URL: http://catalog-service:8080
      RECO_API_URL: http://reco-service:8080
    ports: ["127.0.0.1:${FRONTEND_HOST_PORT:-3000}:3000"]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits: { memory: 384m, cpus: "1.0" }
    networks: [pme-net]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
